name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit (protocol parsers/serializers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Some characterization tests read earlier revisions of a file with git show.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E (real SDKs → gateway → recorded upstreams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run e2e suite
        run: sh tests/e2e/run-e2e.sh

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # vue-tsc, after Nuxt has generated its types: plain tsc cannot resolve .vue imports.
      - run: npx nuxt prepare
      - run: npx vue-tsc --noEmit
